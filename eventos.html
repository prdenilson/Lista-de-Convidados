  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">

  <style>
    .pagina {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
      flex: 1;
    }

    .evento-card {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      align-items: center;
      padding: 35px;
      margin-bottom: 30px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--bg-card);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .evento-card img {
      width: 100%;
      height: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 4px;
    }

    .evento-titulo {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 14px;
    }

    .evento-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.7;
    }

    .evento-info strong {
      color: var(--gold-primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      display: block;
    }

    .timer-container {
      margin-top: 20px;
      padding: 16px 20px;
      background-color: rgba(201, 158, 92, 0.06);
      border: 1px dashed var(--border-color);
      border-radius: 2px;
    }

    .timer-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold-primary);
      margin-bottom: 8px;
    }

    .timer-display {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 600;
      color: #fff;
    }

    @media (max-width: 800px) {
      .evento-card {
        grid-template-columns: 1fr;
        padding: 22px;
        gap: 20px;
      }
    }
  </style>
</head>
