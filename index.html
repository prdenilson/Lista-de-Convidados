<script>

  /* =========================
     SUPABASE
  ========================== */

  const SUPABASE_URL =
    "https://qieejecsicnmsdtefejs.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QbMRb7_7ftE-AvMplgc_GA_1hXNQhBc";

  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================
     ARQUIVO DIGITAL
  ========================== */

  const LIVRO_BUCKET = "Livro";

  const LIVRO_ARQUIVO =
    "Antes que eu seja usado PDF.pdf";


  /* =========================
     ABRIR LOGIN
  ========================== */

  function abrirLogin() {

    const loginArea =
      document.getElementById("loginArea");

    const biblioteca =
      document.getElementById("biblioteca");

    loginArea.style.display = "block";

    biblioteca.style.display = "none";

    loginArea.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }


  /* =========================
     FAZER LOGIN
  ========================== */

  async function fazerLogin() {

    const usuario =
      document
        .getElementById("loginUsuario")
        .value
        .trim();

    const senha =
      document
        .getElementById("loginSenha")
        .value
        .trim();

    const mensagem =
      document.getElementById("mensagemLogin");

    const botao =
      document.getElementById("botaoLogin");


    if (usuario === "" || senha === "") {

      mensagem.className =
        "mensagem-login erro";

      mensagem.style.display =
        "block";

      mensagem.textContent =
        "Digite seu e-mail e sua senha.";

      return;

    }


    botao.disabled = true;

    mensagem.className =
      "mensagem-login";

    mensagem.style.display =
      "block";

    mensagem.textContent =
      "Entrando...";


    try {

      const {
        data,
        error
      } =
        await supabase.auth.signInWithPassword({

          email: usuario,

          password: senha

        });


      if (error) {

        console.error(
          "Erro de login:",
          error
        );


        mensagem.className =
          "mensagem-login erro";

        mensagem.style.display =
          "block";

        mensagem.textContent =
          error.message ||
          "E-mail ou senha inválidos.";

        botao.disabled =
          false;

        return;

      }


      if (!data.session) {

        throw new Error(
          "Login realizado, mas nenhuma sessão foi criada."
        );

      }


      mensagem.style.display =
        "none";


      document
        .getElementById("loginUsuario")
        .value = "";


      document
        .getElementById("loginSenha")
        .value = "";


      const biblioteca =
        document.getElementById("biblioteca");

      biblioteca.style.display =
        "block";


      biblioteca.scrollIntoView({

        behavior: "smooth",

        block: "start"

      });


    } catch (erro) {

      console.error(
        "Erro no login:",
        erro
      );


      mensagem.className =
        "mensagem-login erro";

      mensagem.style.display =
        "block";

      mensagem.textContent =
        "Não foi possível entrar. Verifique seu e-mail e sua senha.";


    } finally {

      botao.disabled =
        false;

    }

  }


  /* =========================
     ABRIR LIVRO
  ========================== */

  async function abrirLivro() {

    const leitor =
      document.getElementById("leitor");

    const frameLivro =
      document.getElementById("frameLivro");

    const mensagem =
      document.getElementById("mensagemLogin");


    try {

      /* -------------------------
         VERIFICAR SESSÃO
      -------------------------- */

      const {
        data,
        error
      } =
        await supabase.auth.getSession();


      if (error) {

        console.error(
          "Erro ao verificar sessão:",
          error
        );

        mensagem.className =
          "mensagem-login erro";

        mensagem.style.display =
          "block";

        mensagem.textContent =
          "Não foi possível verificar seu acesso.";

        abrirLogin();

        return;

      }


      const session =
        data.session;


      if (!session) {

        mensagem.className =
          "mensagem-login erro";

        mensagem.style.display =
          "block";

        mensagem.textContent =
          "Faça login para acessar sua biblioteca.";

        abrirLogin();

        return;

      }


      /* -------------------------
         MOSTRAR LEITOR
      -------------------------- */

      leitor.style.display =
        "block";


      frameLivro.src =
        "";


      const titulo =
        leitor.querySelector(".leitor-titulo");


      if (titulo) {

        titulo.innerHTML = `
          Preparando a leitura de
          <strong>
            Antes Que Eu Seja Usado
          </strong>...
        `;

      }


      leitor.scrollIntoView({

        behavior: "smooth",

        block: "start"

      });


      /* -------------------------
         GERAR URL TEMPORÁRIA
         DO ARQUIVO PRIVADO
      -------------------------- */

      const {
        data: signedData,
        error: signedError
      } =
        await supabase.storage
          .from(LIVRO_BUCKET)
          .createSignedUrl(
            LIVRO_ARQUIVO,
            60 * 60
          );


      if (signedError) {

        console.error(
          "Erro ao criar URL do livro:",
          signedError
        );


        frameLivro.src =
          "";


        if (titulo) {

          titulo.innerHTML = `
            Não foi possível abrir o livro.
          `;

        }


        mensagem.className =
          "mensagem-login erro";

        mensagem.style.display =
          "block";

        mensagem.textContent =
          "O acesso ao arquivo do livro ainda não está autorizado no Supabase Storage.";

        return;

      }


      if (
        !signedData ||
        !signedData.signedUrl
      ) {

        throw new Error(
          "O Supabase não retornou uma URL válida para o livro."
        );

      }


      /* -------------------------
         COLOCAR PDF NO IFRAME
      -------------------------- */

      frameLivro.src =
        signedData.signedUrl;


      if (titulo) {

        titulo.innerHTML = `
          Leitura de
          <strong>
            Antes Que Eu Seja Usado
          </strong>
        `;

      }


      mensagem.style.display =
        "none";


    } catch (erro) {

      console.error(
        "Erro ao abrir livro:",
        erro
      );


      frameLivro.src =
        "";


      const titulo =
        leitor.querySelector(".leitor-titulo");


      if (titulo) {

        titulo.innerHTML = `
          Não foi possível abrir o livro.
        `;

      }


      mensagem.className =
        "mensagem-login erro";

      mensagem.style.display =
        "block";

      mensagem.textContent =
        "Ocorreu um erro ao carregar o livro. Verifique a configuração do armazenamento no Supabase.";

    }

  }


  /* =========================
     SAIR DA BIBLIOTECA
  ========================== */

  async function sairDaBiblioteca() {

    try {

      await supabase.auth.signOut();

    } catch (erro) {

      console.error(
        "Erro ao sair:",
        erro
      );

    }


    const biblioteca =
      document.getElementById("biblioteca");

    const leitor =
      document.getElementById("leitor");

    const frameLivro =
      document.getElementById("frameLivro");


    biblioteca.style.display =
      "none";

    leitor.style.display =
      "none";

    frameLivro.src =
      "";


    document
      .getElementById("loginUsuario")
      .value = "";


    document
      .getElementById("loginSenha")
      .value = "";


    document
      .getElementById("mensagemLogin")
      .style.display =
        "none";


    document
      .getElementById("inicio")
      .scrollIntoView({

        behavior: "smooth",

        block: "start"

      });

  }


  /* =========================
     VERIFICAR SESSÃO AO ABRIR
  ========================== */

  async function verificarSessao() {

    try {

      const {
        data,
        error
      } =
        await supabase.auth.getSession();


      if (error) {

        console.error(
          "Erro ao verificar sessão:",
          error
        );

        return;

      }


      if (data.session) {

        const biblioteca =
          document.getElementById("biblioteca");

        biblioteca.style.display =
          "block";

      }

    } catch (erro) {

      console.error(
        "Erro ao verificar sessão:",
        erro
      );

    }

  }


  /* =========================
     CONFIRMAÇÃO DE PRESENÇA
  ========================== */

  async function confirmarPresenca() {

    const nome =
      document
        .getElementById("nome")
        .value
        .trim();

    const igreja =
      document
        .getElementById("igreja")
        .value
        .trim();

    const mensagem =
      document.getElementById("mensagem");

    const botao =
      document.getElementById("botaoConfirmar");


    if (
      nome === "" ||
      igreja === ""
    ) {

      mensagem.className =
        "erro";

      mensagem.innerHTML = `

        <div class="mensagem-titulo">
          Atenção
        </div>

        Por favor, informe seu nome
        e o nome da sua igreja.

      `;


      mensagem.scrollIntoView({

        behavior: "smooth",

        block: "center"

      });


      return;

    }


    const url =
      "https://script.google.com/macros/s/AKfycbzO6vAGXLNfyfp2-uzxySY91pf2OUQvWf-f_OFV-dTauWVsOzTE9pIvqy_2eYfrKTzqYA/exec";


    botao.disabled =
      true;

    botao.innerHTML =
      "Registrando confirmação...";


    mensagem.className =
      "";

    mensagem.style.display =
      "none";


    try {

      await fetch(

        url,

        {

          method: "POST",

          mode: "no-cors",

          headers: {

            "Content-Type":
              "application/x-www-form-urlencoded"

          },

          body:

            "nome=" +
            encodeURIComponent(nome) +

            "&igreja=" +
            encodeURIComponent(igreja)

        }

      );


      mensagem.className =
        "sucesso";


      mensagem.innerHTML = `

        <div class="mensagem-titulo">

          ✓ Presença confirmada!

        </div>


        <div class="mensagem-introducao">

          Olá,
          <strong>
            ${escapeHtml(nome)}
          </strong>!

          <br><br>

          Sua presença está confirmada com sucesso
          para o lançamento do livro
          <strong>
            Antes Que Eu Seja Usado
          </strong>.

          <br><br>

          Igreja:
          <strong>
            ${escapeHtml(igreja)}
          </strong>

        </div>


        <div class="mensagem-secao">

          <strong class="titulo">

            📍 Detalhes do Evento

          </strong>


          <ul>

            <li>

              <strong>
                Data:
              </strong>

              19 de setembro

            </li>


            <li>

              <strong>
                Horário:
              </strong>

              19h

            </li>


            <li>

              <strong>
                Local:
              </strong>

              Rua Estrada do Siqueira, 485

            </li>

          </ul>

        </div>


        <div class="mensagem-secao">

          <strong class="titulo">

            📖 Seu exemplar

          </strong>


          <p>

            Se você realizou a compra antecipada
            durante a pré-venda, seu exemplar físico
            será reservado e
            <strong>
              entregue no dia do lançamento
            </strong>,
            no local do evento.

            <br><br>

            Além disso, você receberá
            <strong>
              a versão digital do livro
            </strong>,
            benefício exclusivo para quem realizou
            a compra antecipadamente na pré-venda.

          </p>

        </div>


        <div class="mensagem-final">

          Estamos preparando tudo com muito carinho
          e será uma alegria enorme ter você com a
          gente para comemorar esse momento tão especial.

          <br><br>

          <strong>

            Um abraço e até lá!

          </strong>

        </div>

      `;


      mensagem.scrollIntoView({

        behavior: "smooth",

        block: "center"

      });


      botao.innerHTML =
        "Presença confirmada ✓";


    } catch (erro) {

      console.error(
        "Erro ao confirmar presença:",
        erro
      );


      mensagem.className =
        "erro";


      mensagem.innerHTML = `

        <div class="mensagem-titulo">

          Não foi possível confirmar.

        </div>

        Ocorreu um problema ao registrar
        sua presença.

        <br><br>

        Por favor, tente novamente.

      `;


      botao.disabled =
        false;

      botao.innerHTML =
        "Confirmar minha presença";

    }

  }


  /* =========================
     PROTEÇÃO DO TEXTO
  ========================== */

  function escapeHtml(texto) {

    const div =
      document.createElement("div");

    div.textContent =
      texto;

    return div.innerHTML;

  }


  /* =========================
     INICIALIZAÇÃO
  ========================== */

  verificarSessao();


</script>
