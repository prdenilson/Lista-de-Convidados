  <style>
    /* --- CONTEÚDO PRINCIPAL --- */
    .pagina {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
      flex: 1;
    }

    /* --- CARD DO PRODUTO --- */
    .produto {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 50px;
      align-items: start;
      padding: 40px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--bg-card);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .produto-capa {
      text-align: center;
    }

    .produto-capa img {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .produto-info h3 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 10px;
    }
